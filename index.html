    <script type="module" src="/src/main.jsx"></script>

    <script>
      // Markiere Render-Status (main.jsx setzt true, sobald die App gestartet ist)
      window.__kraftstoff_mounted = false;

      // Fail-Safe Watchdog: Ist die Seite vollständig geladen, die App aber nicht gestartet (z.B. ein alter
      // Service-Worker-Cache verweist auf nicht mehr vorhandene Dateien), werden die Caches einmalig bereinigt
      // und die Seite neu geladen. Bei langsamer Verbindung (Seite lädt noch) wird weiter gewartet.
      (function () {
        var started = Date.now();
        function check() {
          if (window.__kraftstoff_mounted) return;
          if (document.readyState !== 'complete' && Date.now() - started < 60000) {
            setTimeout(check, 3000);
            return;
          }
          var alreadyTried = false;
          try { alreadyTried = sessionStorage.getItem('kraftstoff_watchdog_reload') === '1'; } catch (e) {}
          if (alreadyTried) {
            console.warn('App weiterhin nicht gestartet, kein weiterer automatischer Reload.');
            return;
          }
          try { sessionStorage.setItem('kraftstoff_watchdog_reload', '1'); } catch (e) {}
          console.warn('App nicht gestartet, Caches werden bereinigt …');
          var cleanup = [];
          if ('serviceWorker' in navigator) {
            cleanup.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            }));
          }
          if ('caches' in window) {
            cleanup.push(caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }));
          }
          Promise.all(cleanup).catch(function () {}).then(function () { window.location.reload(); });
        }
        setTimeout(check, 12000);
      })();
    </script>
